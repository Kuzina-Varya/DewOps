
services:
  floci:
    image: floci/floci:2.2.0
    ports:
      - "4566:4566"
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    volumes:
      - floci-data:/app/data

  terraform:
    image: hashicorp/terraform:1.16.6
    working_dir: /workspace
    volumes:
      - ./infra:/workspace
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: "${NO_PROXY:-},floci,localhost,127.0.0.1"
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: "${NO_PROXY:-},floci,localhost,127.0.0.1"
    depends_on:
      floci:
        condition: service_healthy
    profiles:
      - tools
  scraper:
    build: .
    image: dewops-quotes
    command: ["node", "src/worker.js"]

    environment:
      AWS_ENDPOINT: "http://floci:4566"
      AWS_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      S3_BUCKET: "dewops-scraper-results"
      SQS_QUEUE_URL: "http://floci:4566/000000000000/dewops-scraper-tasks"

    depends_on:
      floci:
        condition: service_healthy


volumes:
  floci-data:
