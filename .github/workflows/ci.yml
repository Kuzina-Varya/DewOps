---
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Collections, YAML, lint, example inventory syntax, Compose and unit tests
        run: make ci
  vm:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare a Multipass-capable control host
        run: make ci-vm-host
      - name: Real Ubuntu VM, SSH transition, idempotence, HTTP and crash recovery
        run: make ci-vm
      - name: Prove a deleted environment can be recreated
        run: make recreate-test
      - name: Preserve Ansible evidence without private keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ansible-evidence
          path: .lab/logs/
      - name: Destroy twice
        if: always()
        run: make destroy && make destroy
