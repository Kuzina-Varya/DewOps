---
name: quotes-scraper
services:
  redis:
    image: redis:7.4-alpine
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    restart: unless-stopped
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [backend]

  scraper:
    image: quotes-scraper:lab3
    build:
      context: ./app
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=512m
    shm_size: 256m
    restart: unless-stopped
    stop_grace_period: 110s
    environment:
      HOME: /tmp
      REDIS_URL: redis://redis:6379
      RESULTS_DIR: /app/results
      CONTROL_DIR: /app/control
      CLAIM_IDLE_MS: "15000"
    volumes:
      - ./results:/app/results
      - ./control:/app/control
    depends_on:
      redis:
        condition: service_healthy
    networks: [backend, outbound]

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./results:/usr/share/nginx/html/results:ro
    networks: [outbound]

networks:
  backend:
    internal: true
  outbound:

volumes:
  redis-data:
