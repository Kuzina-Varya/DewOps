server {
    listen 80;
    server_name _;
    location = /health {
        default_type text/plain;
        return 200 'ok\n';
    }
    location /results/ {
        root /usr/share/nginx/html;
        autoindex off;
        default_type application/json;
        add_header X-Content-Type-Options nosniff always;
        limit_except GET { deny all; }
        location ~ /\. { deny all; }
        location ~ \.tmp$ { deny all; }
    }
    location / { return 404; }
}
